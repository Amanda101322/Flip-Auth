<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Auth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="auth-section">
            <div class="auth-card">
                <div class="signup-part"></div>
                <h1>Welcome</h1>
                <h2>Create an account</h2>
                <p>Let's get you started</p>
                <form>
                    <label for="name">Type in your name here</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <label for="password">Add a password you'll remember</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit" class="submit-button">Create account</button>
                </form>
                <p>Already have an account?
                        <button type="button" class="switch-card-button">Log in instead</button>
                    </p>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
